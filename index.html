<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>両面宿儺 — Awakening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#07060a;
    --paper:#efe7da;
    --blood:#d4141f;
    --violet:#a07cff;
    --dim:rgba(239,231,218,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--ink)}
  body{background:var(--ink);color:var(--paper);font-family:"Zen Kaku Gothic New",sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}

  /* grain + scanline film texture over everything */
  body::after{
    content:"";position:fixed;inset:-50%;z-index:50;pointer-events:none;opacity:.09;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain .5s steps(4) infinite;
  }
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(1%,3%)}}

  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;z-index:60;background:var(--ink);display:grid;place-items:center;transition:opacity .8s ease,visibility .8s}
  #loader.done{opacity:0;visibility:hidden}
  .ld{display:flex;align-items:center;gap:28px}
  .ld .kanji{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:64px;writing-mode:vertical-rl;letter-spacing:.15em;color:var(--paper)}
  .ld .meta{font-size:11px;letter-spacing:.4em;color:var(--dim);text-transform:uppercase}
  .ld .pct{font-family:"Dela Gothic One";font-size:44px;color:var(--blood);margin-top:10px;font-variant-numeric:tabular-nums}

  /* ---------- pinned sequence ---------- */
  .seq{position:relative;height:700vh}
  .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%)}
  .letterbox::before,.letterbox::after{content:"";position:absolute;left:0;right:0;height:6vh;background:#000;z-index:2}
  .letterbox::before{top:0}.letterbox::after{bottom:0}

  .hud{position:absolute;inset:0;pointer-events:none;z-index:3}
  .hud .side{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:"Shippori Mincho B1",serif;font-weight:800;letter-spacing:.35em;font-size:clamp(14px,1.6vw,20px);color:var(--paper);opacity:.85}
  .hud .side.l{left:clamp(14px,3vw,40px)}
  .hud .side.r{right:clamp(14px,3vw,40px);color:var(--blood)}
  .hud .bar{position:absolute;right:clamp(16px,4vw,48px);bottom:9vh;width:clamp(90px,14vw,180px);height:2px;background:rgba(239,231,218,.18)}
  .hud .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blood)}
  .hud .bar small{position:absolute;right:0;top:-20px;font-size:10px;letter-spacing:.4em;color:var(--dim)}
  .hud .big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(56px,11vw,170px);letter-spacing:.12em;white-space:nowrap;color:var(--paper);text-shadow:0 0 40px rgba(212,20,31,.6);opacity:0}
  .hud .big small{display:block;text-align:center;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:11px;letter-spacing:.8em;color:var(--blood);margin-top:10px;text-shadow:none}
  @media (max-width:640px){.hud .side{display:none}}


  /* ---------- lightning from the top ---------- */
  #bolt{z-index:2;mix-blend-mode:screen;pointer-events:none}
  .flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at var(--fx,50%) 0%,rgba(205,180,255,.55),rgba(120,80,255,.15) 45%,transparent 75%)}
</style>
</head>
<body>

<div id="loader">
  <div class="ld">
    <div class="kanji">覚醒</div>
    <div>
      <div class="meta">Summoning cursed energy</div>
      <div class="pct" id="pct">00%</div>
    </div>
  </div>
</div>

<section class="seq" id="awaken">
  <div class="stage letterbox">
    <canvas id="cv"></canvas>
    <div class="vignette"></div>
    <canvas id="bolt"></canvas>
    <div class="flash" id="flash"></div>
    <div class="hud">
      <div class="side l">呪力解放 ・ 第壱章</div>
      <div class="side r">天上天下唯我独尊</div>
      <div class="bar"><small>覚醒</small><i id="bar"></i></div>
      <div class="big" id="big">開眼<small>THE EYES OPEN</small></div>
    </div>
  </div>
</section>

<script>
(() => {
  const N = 70;
  const pad = n => String(n).padStart(2, "0");
  const eyes = [], storm = [];
  // cut-in clip: only the hand-sign (jutsu) shot, frames 29–40, so it reads as one move
  const HAND_FROM = 29, HAND_TO = 40;

  // Exact cut rhythm measured from Video-15803.mp4 (30fps):
  // face 4f, other 4f, face 3f, other 4f, face 3f, other 3f — 21f (0.7s) loop.
  const PATTERN = [];
  [[0,4],[1,4],[0,3],[1,4],[0,3],[1,3]].forEach(([o,len]) => { for (let i=0;i<len;i++) PATTERN.push(o); });
  const FPS = 30;

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- preload ----------
  const pctEl = document.getElementById("pct");
  let loaded = 0;
  const total = N + (HAND_TO - HAND_FROM + 1);
  function load(arr, dir, from = 1, to = N) {
    for (let i = from; i <= to; i++) {
      const img = new Image();
      img.decoding = "async";
      img.src = `assets/${dir}/${pad(i)}.jpg`;
      const done = () => {
        loaded++;
        pctEl.textContent = pad(Math.round(loaded / total * 100)) + "%";
        if (loaded === total) start();
      };
      img.onload = () => (img.decode ? img.decode().catch(()=>{}) : Promise.resolve()).then(done);
      img.onerror = done;
      arr.push(img);
    }
  }
  load(eyes, "eyes");
  load(storm, "storm", HAND_FROM, HAND_TO);

  // ---------- canvas ----------
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    lastDrawn = null;
  }
  function drawCover(img) {
    if (!img || !img.naturalWidth) return;
    const cw = cv.width, ch = cv.height, iw = img.naturalWidth, ih = img.naturalHeight;
    const s = Math.max(cw / iw, ch / ih);
    const w = iw * s, h = ih * s;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  // ---------- scroll -> playhead ----------
  const seq = document.getElementById("awaken");
  const barEl = document.getElementById("bar");
  const bigEl = document.getElementById("big");

  function targetProgress() {
    const r = seq.getBoundingClientRect();
    const span = r.height - innerHeight;
    return Math.min(1, Math.max(0, -r.top / span));
  }

  let cur = 0, prev = 0, flickerT = 0, idleFor = 1, lastTime = 0, lastDrawn = null;

  function tick(now) {
    const dt = Math.min(64, now - (lastTime || now));
    lastTime = now;

    // smooth, frame-rate independent easing toward scroll position
    const target = targetProgress();
    cur += (target - cur) * (1 - Math.pow(0.9, dt / 16.667));
    if (Math.abs(target - cur) < 0.0002) cur = target;

    const moving = Math.abs(cur - prev) > 0.00003;
    prev = cur;
    idleFor = moving ? 0 : idleFor + dt;

    // the hard-cut rhythm runs on a real 30fps clock while the playhead moves,
    // so the cut speed matches the video no matter how fast you scroll.
    // On rest it settles back on the face.
    let showStorm = false;
    if (!reduceMotion && idleFor < 140 && cur > 0.004 && cur < 0.996) {
      flickerT += dt;
      showStorm = PATTERN[Math.floor(flickerT / 1000 * FPS) % PATTERN.length] === 1;
    } else {
      flickerT = 0;
    }

    const idx = Math.round(cur * (N - 1));
    const key = (showStorm ? "s" + Math.round(cur * (storm.length - 1)) : "e" + idx);
    if (key !== lastDrawn) {
      drawCover(showStorm ? storm[Math.round(cur * (storm.length - 1))] : eyes[idx]);
      lastDrawn = key;
    }

    barEl.style.width = (cur * 100).toFixed(2) + "%";
    // title stamps in once the eyes are fully open (last stretch)
    const t = Math.min(1, Math.max(0, (cur - 0.82) / 0.12));
    bigEl.style.opacity = showStorm ? 0 : t;
    bigEl.style.transform = `translate(-50%,-50%) scale(${1.15 - 0.15 * t})`;

    thunder(dt);
    requestAnimationFrame(tick);
  }


  // ---------- thunder: bolts strike from the top at random intervals ----------
  const bcv = document.getElementById("bolt");
  const bctx = bcv.getContext("2d");
  const flashEl = document.getElementById("flash");
  let bolts = [], nextStrike = 900;

  function boltPath(x, y, len, angle, depth) {
    // jagged segments heading downward, with occasional forks
    const pts = [[x, y]];
    const segs = 14 + Math.random() * 10 | 0;
    const step = len / segs;
    const forks = [];
    for (let i = 0; i < segs; i++) {
      angle += (Math.random() - 0.5) * 0.9;
      angle = Math.max(Math.PI * 0.2, Math.min(Math.PI * 0.8, angle));
      x += Math.cos(angle) * step; y += Math.sin(angle) * step;
      pts.push([x, y]);
      if (depth < 2 && Math.random() < 0.22) forks.push(boltPath(x, y, len * (0.25 + Math.random() * 0.3), angle + (Math.random() < 0.5 ? -0.7 : 0.7), depth + 1));
    }
    return { pts, forks, w: depth ? 1 / (depth + 1.2) : 1 };
  }

  function strike() {
    const W = bcv.width, H = bcv.height;
    const x = W * (0.12 + Math.random() * 0.76);
    bolts.push({ tree: boltPath(x, -10, H * (0.55 + Math.random() * 0.4), Math.PI / 2, 0), age: 0, life: 520 });
    flashEl.style.setProperty("--fx", (x / W * 100).toFixed(1) + "%");
  }

  function drawTree(t, alpha, scale) {
    const p = t.pts;
    bctx.beginPath(); bctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) bctx.lineTo(p[i][0], p[i][1]);
    // outer violet glow, then hot white core
    bctx.strokeStyle = `rgba(160,110,255,${alpha * 0.9})`;
    bctx.lineWidth = 7 * t.w * scale; bctx.shadowColor = "rgba(150,90,255,1)"; bctx.shadowBlur = 30 * scale;
    bctx.stroke();
    bctx.strokeStyle = `rgba(245,238,255,${alpha})`;
    bctx.lineWidth = 2.2 * t.w * scale; bctx.shadowBlur = 8 * scale;
    bctx.stroke();
    t.forks.forEach(f => drawTree(f, alpha * 0.8, scale));
  }

  function thunder(dt) {
    if (reduceMotion) return;
    nextStrike -= dt;
    if (nextStrike <= 0) {
      strike();
      if (Math.random() < 0.35) setTimeout(strike, 90 + Math.random() * 120); // double strike
      nextStrike = 1800 + Math.random() * 3200;
    }
    bctx.clearRect(0, 0, bcv.width, bcv.height);
    bctx.lineCap = bctx.lineJoin = "round";
    let flash = 0;
    const scale = bcv.width / 1600 + 0.4;
    bolts = bolts.filter(b => (b.age += dt) < b.life);
    bolts.forEach(b => {
      const k = b.age / b.life;
      // flicker: bright hit, brief dip, re-flare, then fade
      const a = k < 0.12 ? 1 : k < 0.2 ? 0.25 : k < 0.32 ? 0.95 : Math.max(0, 1 - (k - 0.32) / 0.68);
      drawTree(b.tree, a, scale);
      flash = Math.max(flash, a);
    });
    flashEl.style.opacity = flash.toFixed(3);
  }

  function resizeBolt() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    bcv.width = Math.round(bcv.clientWidth * dpr);
    bcv.height = Math.round(bcv.clientHeight * dpr);
  }

  function start() {
    resize(); resizeBolt();
    addEventListener("resize", () => { resize(); resizeBolt(); });
    document.getElementById("loader").classList.add("done");
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
